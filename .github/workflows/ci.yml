name: CI

on:
  pull_request:
    branches: [main, dev]
  workflow_dispatch:

# Um push novo no mesmo pull request cancela a execução anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verificacao:
    # Este nome é o check marcado como obrigatório nas regras de proteção de main e dev.
    name: Verificação
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependências
        run: npm ci

      - name: Verificar tipos
        run: npm run typecheck

      - name: Validar o catálogo de espécies
        run: npm run validar-catalogo

      - name: Rodar os testes
        run: npm test -- --ci
